name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise the phone interface
        env:
          GG_BROWSER: ${{ matrix.browser }}
        run: |
          node tests/ui.cjs
          node tests/native-bridge.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Interface-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
  build:
    needs: interface
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check content and behavior
        run: |
          node scripts/check.cjs
          node --test tests/core.test.cjs
      - name: Show the Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile unsigned device app
        run: bash scripts/build-ios.sh device
      - name: Compile and exercise simulator app
        run: |
          bash scripts/build-ios.sh simulator
          bash scripts/simulator-smoke.sh
      - name: Downloadable IPA
        uses: actions/upload-artifact@v7
        with:
          name: GoodGround-iPhone
          path: |
            build/GoodGround-unsigned.ipa
            build/GoodGround-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Simulator validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Simulator-checks
          path: build/validation/
          if-no-files-found: ignore
          retention-days: 14
